<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="large-scale ecommerce clickstream analytics visual">
  <rect width="100%" height="100%" fill="#f7f8fb"/>
  <style>
    .title{font:700 30px Arial, sans-serif;fill:#1f2937}
    .subtitle{font:400 14px Arial, sans-serif;fill:#5f6b7a}
    .h{font:700 16px Arial, sans-serif;fill:#1f2937}
    .label{font:400 13px Arial, sans-serif;fill:#5f6b7a}
    .value{font:700 25px Arial, sans-serif;fill:#1f2937}
    .small{font:400 12px Arial, sans-serif;fill:#5f6b7a}
    .xs{font:400 10px Arial, sans-serif;fill:#5f6b7a}
    .white{fill:#ffffff}
    .pill{font:700 11px Arial, sans-serif;fill:#ffffff}
  </style>

  <text x="40" y="50" class="title">Product Friction and Category Performance</text>
  <text x="40" y="76" class="subtitle">Prioritizing products with high attention but weak purchase movement</text>
  <rect x="40" y="112" width="620" height="380" rx="12" fill="#fff" stroke="#d9dee7"/>
  <text x="70" y="146" class="h">Top friction candidates</text>
  <text x="275" y="180" class="small">Revenue index</text>
  <text x="540" y="180" class="small">CVR index</text>
  <text x="70" y="227" class="label">electronics.smartphone</text>
  <rect x="275" y="210" width="200.0" height="22" rx="4" fill="#1f5f8b"/>
  <text x="484.0" y="227" class="small">100</text>
  <rect x="540" y="210" width="110.0" height="22" rx="4" fill="#2f9e8f"/>
  <text x="660.0" y="227" class="small">22</text>
  <text x="70" y="279" class="label">computers.notebook</text>
  <rect x="275" y="262" width="164.0" height="22" rx="4" fill="#1f5f8b"/>
  <text x="448.0" y="279" class="small">82</text>
  <rect x="540" y="262" width="75.0" height="22" rx="4" fill="#2f9e8f"/>
  <text x="625.0" y="279" class="small">15</text>
  <text x="70" y="331" class="label">appliances.kitchen</text>
  <rect x="275" y="314" width="148.0" height="22" rx="4" fill="#1f5f8b"/>
  <text x="432.0" y="331" class="small">74</text>
  <rect x="540" y="314" width="60.0" height="22" rx="4" fill="#2f9e8f"/>
  <text x="610.0" y="331" class="small">12</text>
  <text x="70" y="383" class="label">electronics.audio</text>
  <rect x="275" y="366" width="110.0" height="22" rx="4" fill="#1f5f8b"/>
  <text x="394.0" y="383" class="small">55</text>
  <rect x="540" y="366" width="45.0" height="22" rx="4" fill="#2f9e8f"/>
  <text x="595.0" y="383" class="small">9</text>
  <text x="70" y="435" class="label">accessories</text>
  <rect x="275" y="418" width="76.0" height="22" rx="4" fill="#1f5f8b"/>
  <text x="360.0" y="435" class="small">38</text>
  <rect x="540" y="418" width="20.0" height="22" rx="4" fill="#2f9e8f"/>
  <text x="570.0" y="435" class="small">4</text>
  <rect x="700" y="112" width="350" height="380" rx="12" fill="#fff" stroke="#d9dee7"/>
  <text x="728" y="146" class="h">Friction score components</text>
  <rect x="730" y="188" width="180" height="24" rx="5" fill="#1f5f8b"/><text x="925" y="205" class="small">attention percentile</text>
  <rect x="730" y="236" width="130" height="24" rx="5" fill="#2f9e8f"/><text x="875" y="253" class="small">weak view-to-cart</text>
  <rect x="730" y="284" width="142" height="24" rx="5" fill="#e6a23c"/><text x="887" y="301" class="small">weak cart-to-purchase</text>
  <rect x="730" y="332" width="86" height="24" rx="5" fill="#c95f4f"/><text x="831" y="349" class="small">remove pressure</text>
  <text x="728" y="410" class="small">Output is a review queue, not proof of cause.</text>
  <rect x="40" y="530" width="1010" height="64" rx="12" fill="#fff" stroke="#d9dee7"/>
  <text x="70" y="568" class="small">Analytical use: identify products with high browsing activity but weak purchase movement for product, pricing, content, availability, or tracking follow-up.</text>
</svg>