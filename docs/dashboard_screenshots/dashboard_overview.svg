<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1030" viewBox="0 0 900 1030" role="img" aria-label="large-scale ecommerce clickstream analytics visual">
  <rect width="100%" height="100%" fill="#f7f8fb"/>
  <style>
    .title{font:700 28px Arial, sans-serif;fill:#1f2937}
    .subtitle{font:400 14px Arial, sans-serif;fill:#5f6b7a}
    .h{font:700 16px Arial, sans-serif;fill:#1f2937}
    .label{font:400 13px Arial, sans-serif;fill:#5f6b7a}
    .value{font:700 24px Arial, sans-serif;fill:#1f2937}
    .small{font:400 12px Arial, sans-serif;fill:#5f6b7a}
  </style>

  <text x="40" y="50" class="title">Large-Scale E-commerce Clickstream Dashboard</text>
  <text x="40" y="76" class="subtitle">Public dataset workflow: raw events -&gt; silver validated events -&gt; gold KPI tables -&gt; Power BI insights</text>
  <rect x="40" y="105" width="250" height="96" rx="10" fill="#fff" stroke="#d9dee7"/>
  <text x="58" y="133" class="label">Dataset Scale</text>
  <text x="58" y="166" class="value">285M</text>
  <text x="58" y="189" class="small">public clickstream events</text>
  <rect x="315" y="105" width="250" height="96" rx="10" fill="#fff" stroke="#d9dee7"/>
  <text x="333" y="133" class="label">Time Range</text>
  <text x="333" y="166" class="value">7 months</text>
  <text x="333" y="189" class="small">Oct 2019 - Apr 2020</text>
  <rect x="590" y="105" width="250" height="96" rx="10" fill="#fff" stroke="#d9dee7"/>
  <text x="608" y="133" class="label">Granularity</text>
  <text x="608" y="166" class="value">event-level</text>
  <text x="608" y="189" class="small">user + session + product</text>
  <rect x="40" y="223" width="250" height="96" rx="10" fill="#fff" stroke="#d9dee7"/>
  <text x="58" y="251" class="label">Journey Events</text>
  <text x="58" y="284" class="value">4 types</text>
  <text x="58" y="307" class="small">view, cart, remove, purchase</text>
  <rect x="315" y="223" width="250" height="96" rx="10" fill="#fff" stroke="#d9dee7"/>
  <text x="333" y="251" class="label">Gold Tables</text>
  <text x="333" y="284" class="value">2 core</text>
  <text x="333" y="307" class="small">journey + product KPIs</text>
  <rect x="40" y="345" width="820" height="270" rx="10" fill="#fff" stroke="#d9dee7"/>
  <text x="64" y="380" class="h">Customer Journey Funnel</text>
  <text x="64" y="402" class="small">Illustrative rates after SQL aggregation by session</text>
  <text x="64" y="455" class="label">Product view</text>
  <rect x="245" y="438" width="420" height="24" rx="4" fill="#1f5f8b"/>
  <text x="680" y="455" class="small">100%</text>
  <text x="64" y="500" class="label">Add to cart</text>
  <rect x="245" y="483" width="75.6" height="24" rx="4" fill="#2f9e8f"/>
  <text x="335.6" y="500" class="small">18%</text>
  <text x="64" y="545" class="label">Remove cart</text>
  <rect x="245" y="528" width="29.4" height="24" rx="4" fill="#e6a23c"/>
  <text x="289.4" y="545" class="small">7%</text>
  <text x="64" y="590" class="label">Purchase</text>
  <rect x="245" y="573" width="21" height="24" rx="4" fill="#c95f4f"/>
  <text x="281" y="590" class="small">5%</text>
  <rect x="40" y="655" width="820" height="295" rx="10" fill="#fff" stroke="#d9dee7"/>
  <text x="64" y="690" class="h">Revenue Index by Category</text>
  <text x="64" y="712" class="small">Designed for category-level stakeholder review</text>
  <rect x="120" y="770" width="58" height="135" rx="5" fill="#1f5f8b"/>
  <text x="149" y="930" text-anchor="middle" class="small">electronics</text>
  <text x="149" y="762" text-anchor="middle" class="small">100</text>
  <rect x="265" y="805.1" width="58" height="99.9" rx="5" fill="#1f5f8b"/>
  <text x="294" y="930" text-anchor="middle" class="small">appliances</text>
  <text x="294" y="797.1" text-anchor="middle" class="small">74</text>
  <rect x="410" y="819.95" width="58" height="85.05" rx="5" fill="#1f5f8b"/>
  <text x="439" y="930" text-anchor="middle" class="small">computers</text>
  <text x="439" y="811.95" text-anchor="middle" class="small">63</text>
  <rect x="555" y="848.3" width="58" height="56.7" rx="5" fill="#1f5f8b"/>
  <text x="584" y="930" text-anchor="middle" class="small">accessories</text>
  <text x="584" y="840.3" text-anchor="middle" class="small">42</text>
  <rect x="700" y="868.55" width="58" height="36.45" rx="5" fill="#1f5f8b"/>
  <text x="729" y="930" text-anchor="middle" class="small">unknown</text>
  <text x="729" y="860.55" text-anchor="middle" class="small">27</text>
  <text x="40" y="995" class="small">Interpretation: separate product discovery, cart intent, purchase conversion, and data quality before making recommendations.</text>
</svg>
