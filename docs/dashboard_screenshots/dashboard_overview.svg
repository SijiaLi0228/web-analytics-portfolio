<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660" role="img" aria-label="large-scale ecommerce clickstream analytics visual">
  <rect width="100%" height="100%" fill="#f7f8fb"/>
  <style>
    .title{font:700 28px Arial, sans-serif;fill:#1f2937}
    .subtitle{font:400 14px Arial, sans-serif;fill:#5f6b7a}
    .h{font:700 16px Arial, sans-serif;fill:#1f2937}
    .label{font:400 13px Arial, sans-serif;fill:#5f6b7a}
    .value{font:700 24px Arial, sans-serif;fill:#1f2937}
    .small{font:400 12px Arial, sans-serif;fill:#5f6b7a}
  </style>

  <text x="40" y="50" class="title">Large-Scale E-commerce Clickstream Dashboard</text>
  <text x="40" y="76" class="subtitle">Public dataset workflow: raw events -> silver validated events -> gold KPI tables -> Power BI insights</text>
  <rect x="40" y="105" width="164" height="100" rx="10" fill="#fff" stroke="#d9dee7"/>
  <text x="56" y="133" class="label">Dataset Scale</text>
  <text x="56" y="167" class="value">285M</text>
  <text x="56" y="191" class="small">public clickstream events</text>
  <rect x="224" y="105" width="164" height="100" rx="10" fill="#fff" stroke="#d9dee7"/>
  <text x="240" y="133" class="label">Time Range</text>
  <text x="240" y="167" class="value">7 months</text>
  <text x="240" y="191" class="small">Oct 2019 - Apr 2020</text>
  <rect x="408" y="105" width="164" height="100" rx="10" fill="#fff" stroke="#d9dee7"/>
  <text x="424" y="133" class="label">Granularity</text>
  <text x="424" y="167" class="value">event-level</text>
  <text x="424" y="191" class="small">user + session + product</text>
  <rect x="592" y="105" width="164" height="100" rx="10" fill="#fff" stroke="#d9dee7"/>
  <text x="608" y="133" class="label">Journey Events</text>
  <text x="608" y="167" class="value">4 types</text>
  <text x="608" y="191" class="small">view, cart, remove, purchase</text>
  <rect x="776" y="105" width="164" height="100" rx="10" fill="#fff" stroke="#d9dee7"/>
  <text x="792" y="133" class="label">Gold Tables</text>
  <text x="792" y="167" class="value">2 core</text>
  <text x="792" y="191" class="small">journey + product KPIs</text>
  <rect x="40" y="245" width="420" height="300" rx="10" fill="#fff" stroke="#d9dee7"/>
  <text x="64" y="280" class="h">Customer Journey Funnel</text>
  <text x="64" y="302" class="small">Illustrative rates after SQL aggregation by session</text>
  <text x="64" y="357" class="label">Product view</text>
  <rect x="185" y="340" width="300" height="24" rx="4" fill="#1f5f8b"/>
  <text x="495" y="357" class="small">100%</text>
  <text x="64" y="403" class="label">Add to cart</text>
  <rect x="185" y="386" width="54" height="24" rx="4" fill="#2f9e8f"/>
  <text x="249" y="403" class="small">18%</text>
  <text x="64" y="449" class="label">Remove cart</text>
  <rect x="185" y="432" width="21" height="24" rx="4" fill="#e6a23c"/>
  <text x="216" y="449" class="small">7%</text>
  <text x="64" y="495" class="label">Purchase</text>
  <rect x="185" y="478" width="15" height="24" rx="4" fill="#c95f4f"/>
  <text x="210" y="495" class="small">5%</text>
  <rect x="500" y="245" width="440" height="300" rx="10" fill="#fff" stroke="#d9dee7"/>
  <text x="524" y="280" class="h">Revenue Index by Category</text>
  <text x="524" y="302" class="small">Designed for category-level stakeholder review</text>
  <rect x="540" y="335.0" width="42" height="165.0" rx="4" fill="#1f5f8b"/>
  <text x="561" y="520" text-anchor="middle" class="small">electronics</text>
  <text x="561" y="327.0" text-anchor="middle" class="small">100</text>
  <rect x="614" y="377.9" width="42" height="122.1" rx="4" fill="#1f5f8b"/>
  <text x="635" y="520" text-anchor="middle" class="small">appliances</text>
  <text x="635" y="369.9" text-anchor="middle" class="small">74</text>
  <rect x="688" y="396.05" width="42" height="103.94999999999999" rx="4" fill="#1f5f8b"/>
  <text x="709" y="520" text-anchor="middle" class="small">computers</text>
  <text x="709" y="388.05" text-anchor="middle" class="small">63</text>
  <rect x="762" y="430.7" width="42" height="69.3" rx="4" fill="#1f5f8b"/>
  <text x="783" y="520" text-anchor="middle" class="small">accessories</text>
  <text x="783" y="422.7" text-anchor="middle" class="small">42</text>
  <rect x="836" y="455.45" width="42" height="44.55" rx="4" fill="#1f5f8b"/>
  <text x="857" y="520" text-anchor="middle" class="small">unknown</text>
  <text x="857" y="447.45" text-anchor="middle" class="small">27</text>
  <text x="40" y="605" class="small">Interpretation: the analyst separates product discovery, cart intent, purchase conversion, and data quality before making recommendations.</text>
</svg>
