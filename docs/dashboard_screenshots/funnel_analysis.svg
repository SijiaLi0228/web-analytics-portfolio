<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="large-scale ecommerce clickstream analytics visual">
  <rect width="100%" height="100%" fill="#f7f8fb"/>
  <style>
    .title{font:700 28px Arial, sans-serif;fill:#1f2937}
    .subtitle{font:400 14px Arial, sans-serif;fill:#5f6b7a}
    .h{font:700 16px Arial, sans-serif;fill:#1f2937}
    .label{font:400 13px Arial, sans-serif;fill:#5f6b7a}
    .value{font:700 24px Arial, sans-serif;fill:#1f2937}
    .small{font:400 12px Arial, sans-serif;fill:#5f6b7a}
  </style>

  <text x="40" y="50" class="title">Customer Journey Funnel</text>
  <text x="40" y="76" class="subtitle">Session-level modeling for large-scale product behavior events</text>
  <text x="50" y="148" class="label">View sessions</text>
  <rect x="270" y="125" width="420" height="34" rx="5" fill="#1f5f8b"/>
  <text x="705" y="148" class="small">100%</text>
  <text x="50" y="218" class="label">Cart sessions</text>
  <rect x="270" y="195" width="75.6" height="34" rx="5" fill="#2f9e8f"/>
  <text x="360.6" y="218" class="small">18%</text>
  <text x="50" y="288" class="label">Remove-from-cart sessions</text>
  <rect x="270" y="265" width="29.4" height="34" rx="5" fill="#e6a23c"/>
  <text x="314.4" y="288" class="small">7%</text>
  <text x="50" y="358" class="label">Purchase sessions</text>
  <rect x="270" y="335" width="21" height="34" rx="5" fill="#c95f4f"/>
  <text x="306" y="358" class="small">5%</text>
  <text x="40" y="430" class="small">Example use: high product views with weak cart or purchase movement should trigger category, pricing, availability, and tracking checks.</text>
</svg>
