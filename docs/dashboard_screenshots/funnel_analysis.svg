<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-label="large-scale ecommerce clickstream analytics visual">
  <rect width="100%" height="100%" fill="#f7f8fb"/>
  <style>
    .title{font:700 28px Arial, sans-serif;fill:#1f2937}
    .subtitle{font:400 14px Arial, sans-serif;fill:#5f6b7a}
    .h{font:700 16px Arial, sans-serif;fill:#1f2937}
    .label{font:400 13px Arial, sans-serif;fill:#5f6b7a}
    .value{font:700 24px Arial, sans-serif;fill:#1f2937}
    .small{font:400 12px Arial, sans-serif;fill:#5f6b7a}
  </style>

  <text x="40" y="50" class="title">Customer Journey Funnel</text>
  <text x="40" y="76" class="subtitle">Session-level modeling for large-scale product behavior events</text>
  <text x="50" y="148" class="label">View sessions</text>
  <rect x="240" y="125" width="580.0" height="34" rx="5" fill="#1f5f8b"/>
  <text x="835.0" y="148" class="small">100% of product-view sessions</text>
  <text x="50" y="218" class="label">Cart sessions</text>
  <rect x="240" y="195" width="104.39999999999999" height="34" rx="5" fill="#2f9e8f"/>
  <text x="359.4" y="218" class="small">18% of product-view sessions</text>
  <text x="50" y="288" class="label">Remove-from-cart sessions</text>
  <rect x="240" y="265" width="40.6" height="34" rx="5" fill="#e6a23c"/>
  <text x="295.6" y="288" class="small">7% of product-view sessions</text>
  <text x="50" y="358" class="label">Purchase sessions</text>
  <rect x="240" y="335" width="29.0" height="34" rx="5" fill="#c95f4f"/>
  <text x="284.0" y="358" class="small">5% of product-view sessions</text>
  <text x="40" y="425" class="small">Example use: high product views with weak cart or purchase movement should trigger category, pricing, availability, and tracking checks.</text>
</svg>
